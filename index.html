<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141613">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Бухгалтерія">
<title>Бухгалтерія</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --bg: #f4f5f2; --card: #ffffff; --text: #1d211b; --muted: #6b7266;
    --line: #e2e5de; --accent: #6b875b; --accent-ink: #ffffff;
    --exp: #b4533c; --inc: #3f7d4e; --loan: #6a5b9a; --warn: #a77a1c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141613; --card: #1f221d; --text: #eef0ea; --muted: #9aa294;
      --line: #30352d; --accent: #8fae7c; --accent-ink: #10130e; --warn: #d9a945; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior-y: contain; }
  .wrap { max-width: 520px; margin: 0 auto; padding: calc(14px + env(safe-area-inset-top)) 14px 110px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 9px 10px; }
  .stat small { display: block; color: var(--muted); font-size: 11px; }
  .stat b { font-size: 15px; white-space: nowrap; }
  .status { min-height: 18px; font-size: 12px; color: var(--muted); margin: 0 2px 10px; display: flex; gap: 10px; }
  .status .warn { color: var(--warn); font-weight: 600; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px; }
  .seg button { border: 0; background: transparent; color: var(--text); font: inherit;
    padding: 10px 6px; border-radius: 10px; font-weight: 600; }
  .seg button.on { background: var(--accent); color: var(--accent-ink); }
  .seg.type button.on[data-v="Витрата"] { background: var(--exp); color: #fff; }
  .seg.type button.on[data-v="Дохід"] { background: var(--inc); color: #fff; }
  .seg.type button.on[data-v="Позика"] { background: var(--loan); color: #fff; }
  .amount { display: flex; align-items: baseline; gap: 8px; background: var(--card);
    border: 1px solid var(--line); border-radius: 16px; padding: 10px 16px; margin: 12px 0; }
  .amount input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
    color: var(--text); font-size: 40px; font-weight: 700; }
  .amount span { color: var(--muted); font-size: 20px; }
  label.h { display: block; color: var(--muted); font-size: 13px; margin: 14px 2px 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip { border: 1px solid var(--line); background: var(--card); color: var(--text);
    font: inherit; font-size: 15px; padding: 9px 13px; border-radius: 999px; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .chip.more { color: var(--muted); border-style: dashed; }
  input.txt, select { width: 100%; border: 1px solid var(--line); background: var(--card);
    color: var(--text); font: inherit; padding: 12px 14px; border-radius: 12px; outline: 0; }
  details { margin-top: 14px; }
  details summary { color: var(--muted); font-size: 14px; padding: 4px 2px; cursor: pointer; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .save { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(transparent, var(--bg) 30%); }
  .save button { display: block; width: 100%; max-width: 492px; margin: 0 auto; border: 0;
    background: var(--accent); color: var(--accent-ink); font: inherit; font-size: 18px; font-weight: 700;
    padding: 16px; border-radius: 16px; }
  .recent { margin-top: 22px; }
  .item { display: flex; justify-content: space-between; gap: 10px; padding: 9px 2px; border-bottom: 1px solid var(--line); font-size: 14px; }
  .item .l { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .l small { color: var(--muted); }
  .item .r { white-space: nowrap; font-weight: 600; }
  .item .r.exp { color: var(--exp); } .item .r.inc { color: var(--inc); }
  .item.pending { opacity: .65; }
  .toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg); padding: 11px 14px; border-radius: 12px; font-size: 15px;
    display: flex; gap: 14px; align-items: center; opacity: 0; pointer-events: none; transition: .2s; max-width: 92vw; }
  .toast.show { opacity: 1; transform: translateX(-50%); pointer-events: auto; }
  .toast button { border: 0; background: transparent; color: var(--accent); font: inherit; font-weight: 700; }
  .toast.err { background: var(--exp); color: #fff; }
  .toast.err button { color: #fff; }
  .loading { color: var(--muted); padding: 10px 2px; }
  .setup { max-width: 420px; margin: 18vh auto 0; padding: 0 20px; text-align: center; }
  .setup img { width: 88px; height: 88px; border-radius: 22px; }
  .setup p { color: var(--muted); }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="setup hidden" id="setup">
  <img src="icon-192.png" alt="">
  <h2>Бухгалтерія</h2>
  <p>Додаток ще не підключений до твоєї таблиці. Відкрий на цьому телефоні посилання для налаштування, яке тобі дав Claude.</p>
</div>

<div id="app" class="hidden">
<div class="wrap">
  <div class="stats">
    <div class="stat"><small>Сьогодні</small><b id="sToday">—</b></div>
    <div class="stat"><small>Витрати за місяць</small><b id="sMonthExp">—</b></div>
    <div class="stat"><small>Доходи за місяць</small><b id="sMonthInc">—</b></div>
  </div>
  <div class="status" id="status"></div>

  <div class="seg type" id="types">
    <button data-v="Витрата" class="on">Витрата</button>
    <button data-v="Дохід">Дохід</button>
    <button data-v="Позика">Позика</button>
  </div>

  <div class="amount">
    <input id="amount" type="text" inputmode="decimal" placeholder="0" autocomplete="off" enterkeyhint="done">
    <span>грн</span>
  </div>

  <label class="h">Категорія</label>
  <div class="chips" id="cats"><div class="loading">Завантаження…</div></div>

  <label class="h">Звідки</label>
  <div class="seg" id="sources">
    <button data-v="Карта" class="on">Карта</button>
    <button data-v="Готівка">Готівка</button>
  </div>

  <label class="h">Коментар (необов'язково)</label>
  <input class="txt" id="comment" type="text" placeholder="АТБ, робота, Novus…" autocomplete="off" enterkeyhint="done">

  <details id="more">
    <summary>Дата і розподіл</summary>
    <div class="row2">
      <input class="txt" id="date" type="date">
      <select id="dist"><option value="">Розподіл: —</option></select>
    </div>
  </details>

  <div class="recent">
    <label class="h">Останні записи</label>
    <div id="recent"></div>
  </div>
</div>
<div class="save"><button id="saveBtn">Зберегти</button></div>
</div>

<div class="toast" id="toast"><span id="toastText"></span><button id="undoBtn">Скасувати</button></div>

<script>
(function () {
  'use strict';
  var TOP = 8;
  var DISTRIBUTIONS = ['На себе', 'Інвестування в акції', "Сім'я", 'Благодійність', 'Навчання'];

  // ---------- storage ----------
  function lsGet(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function $(id) { return document.getElementById(id); }

  // ---------- setup via link: #setup=<base64url(JSON{u,k})> ----------
  (function readSetup() {
    var m = location.hash.match(/setup=([A-Za-z0-9_\-]+)/);
    if (!m) return;
    try {
      var b64 = m[1].replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      var cfg = JSON.parse(atob(b64));
      if (cfg.u && cfg.k) lsSet('cfg', { u: cfg.u, k: cfg.k });
    } catch (e) {}
    history.replaceState(null, '', location.pathname + location.search);
  })();

  var cfg = lsGet('cfg', null);
  if (!cfg) { $('setup').classList.remove('hidden'); return; }
  $('app').classList.remove('hidden');

  var state = {
    type: 'Витрата', source: lsGet('src', 'Карта'), category: '', showAll: false,
    data: lsGet('init', null), lastId: null, flushing: false
  };

  // ---------- helpers ----------
  function money(n) { return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ₴'; }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }
  function uid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return Date.now().toString(36) + Math.random().toString(36).slice(2);
  }
  function NetErr(msg) { this.message = msg; this.net = true; }

  function api(body) {
    body.k = cfg.k;
    return fetch(cfg.u, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body),
      redirect: 'follow'
    }).catch(function () { throw new NetErr('Немає зв\'язку'); })
      .then(function (r) {
        if (!r.ok) throw new NetErr('Сервер відповів ' + r.status);
        return r.json().catch(function () { throw new NetErr('Некоректна відповідь'); });
      })
      .then(function (j) { if (!j.ok) throw new Error(j.error || 'Помилка'); return j; });
  }

  // ---------- toast ----------
  var toastTimer;
  function toast(text, isErr, undoId) {
    var t = $('toast');
    $('toastText').textContent = text;
    $('undoBtn').style.display = undoId ? '' : 'none';
    state.lastId = undoId || null;
    t.classList.toggle('err', !!isErr);
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); state.lastId = null; }, undoId ? 6000 : 3500);
  }

  // ---------- segmented controls ----------
  function setSeg(el, v) { [].forEach.call(el.children, function (x) { x.classList.toggle('on', x.dataset.v === v); }); }
  function segment(el, key, onChange) {
    el.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      state[key] = b.dataset.v; setSeg(el, b.dataset.v);
      if (onChange) onChange();
    });
  }
  segment($('types'), 'type', function () { state.category = ''; state.showAll = false; renderCats(); });
  segment($('sources'), 'source', function () { lsSet('src', state.source); });
  setSeg($('sources'), state.source);

  DISTRIBUTIONS.forEach(function (x) {
    var o = document.createElement('option'); o.value = x; o.textContent = x; $('dist').appendChild(o);
  });
  $('date').value = todayStr();

  // ---------- render ----------
  function renderCats() {
    var box = $('cats'); box.innerHTML = '';
    if (!state.data) { box.innerHTML = '<div class="loading">Завантаження…</div>'; return; }
    var list = state.data.categories[state.type] || [];
    var shown = state.showAll ? list : list.slice(0, TOP);
    if (state.category && shown.indexOf(state.category) === -1) shown = shown.concat([state.category]);
    shown.forEach(function (c) {
      var b = document.createElement('button');
      b.className = 'chip' + (c === state.category ? ' on' : '');
      b.textContent = c;
      b.onclick = function () {
        state.category = c;
        $('dist').value = state.type === 'Витрата' ? (state.data.autoDist[c] || '') : '';
        renderCats();
      };
      box.appendChild(b);
    });
    if (list.length > TOP) {
      var m = document.createElement('button');
      m.className = 'chip more';
      m.textContent = state.showAll ? 'Менше ▴' : 'Ще ' + (list.length - TOP) + ' ▾';
      m.onclick = function () { state.showAll = !state.showAll; renderCats(); };
      box.appendChild(m);
    }
  }

  function itemRow(it, pending) {
    var div = document.createElement('div'); div.className = 'item' + (pending ? ' pending' : '');
    var cls = it.type === 'Дохід' ? 'inc' : (it.type === 'Витрата' ? 'exp' : '');
    var sign = it.type === 'Дохід' ? '+' : (it.type === 'Витрата' ? '−' : '');
    var l = document.createElement('div'); l.className = 'l';
    l.textContent = (pending ? '⏳ ' : '') + it.date + ' · ' + it.cat;
    if (it.comment) { var s = document.createElement('small'); s.textContent = ' · ' + it.comment; l.appendChild(s); }
    var r = document.createElement('div'); r.className = 'r ' + cls; r.textContent = sign + money(it.sum);
    div.appendChild(l); div.appendChild(r);
    return div;
  }

  function render() {
    var d = state.data;
    var q = lsGet('queue', []);
    if (d) {
      $('sToday').textContent = money(d.todayExpense);
      $('sMonthExp').textContent = money(d.monthExpense);
      $('sMonthInc').textContent = money(d.monthIncome);
    }
    renderCats();
    var r = $('recent'); r.innerHTML = '';
    q.slice().reverse().forEach(function (it) {
      r.appendChild(itemRow({
        date: it.data.date.slice(8, 10) + '.' + it.data.date.slice(5, 7), type: it.data.type,
        cat: it.data.category, sum: parseFloat(it.data.amount), comment: it.data.comment
      }, true));
    });
    (d ? d.recent : []).forEach(function (it) { r.appendChild(itemRow(it, false)); });

    var st = $('status'); st.innerHTML = '';
    if (!navigator.onLine) { var a = document.createElement('span'); a.className = 'warn'; a.textContent = '● Офлайн'; st.appendChild(a); }
    if (q.length) {
      var b = document.createElement('span'); b.className = 'warn';
      b.textContent = '⏳ Очікують відправки: ' + q.length; st.appendChild(b);
    }
  }

  // ---------- data ----------
  function load() {
    return api({ action: 'init' }).then(function (j) {
      state.data = j.data; lsSet('init', j.data); render();
    }).catch(function (e) {
      if (!e.net) toast('Помилка: ' + e.message, true);
      render();
    });
  }

  function flush() {
    if (state.flushing) return Promise.resolve();
    var q = lsGet('queue', []);
    if (!q.length) return Promise.resolve();
    state.flushing = true;
    var item = q[0];
    return api({ action: 'add', id: item.id, data: item.data }).then(function (j) {
      var synced = lsGet('synced', {});
      synced[item.id] = j.result;
      var keys = Object.keys(synced); if (keys.length > 20) delete synced[keys[0]];
      lsSet('synced', synced);
      lsSet('queue', lsGet('queue', []).filter(function (x) { return x.id !== item.id; }));
      state.flushing = false;
      return flush();
    }, function (e) {
      state.flushing = false;
      if (e.net) { render(); throw e; }
      // Помилка даних — запис неможливо зберегти, прибираємо з черги
      lsSet('queue', lsGet('queue', []).filter(function (x) { return x.id !== item.id; }));
      toast('Не збережено (' + item.data.category + '): ' + e.message, true);
      return flush();
    });
  }

  function syncAll() {
    return flush().then(load, function () { render(); });
  }

  // ---------- actions ----------
  $('saveBtn').onclick = function () {
    var amount = $('amount').value.replace(/\s/g, '').replace(',', '.');
    if (!(parseFloat(amount) > 0)) { toast('Введи суму', true); $('amount').focus(); return; }
    if (!state.category) { toast('Обери категорію', true); return; }
    var item = {
      id: uid(),
      data: {
        type: state.type, category: state.category, amount: amount, source: state.source,
        comment: $('comment').value.trim(), date: $('date').value || todayStr(), dist: $('dist').value
      }
    };
    var q = lsGet('queue', []); q.push(item); lsSet('queue', q);

    toast('Записано: ' + item.data.category + ' ' + money(parseFloat(amount)), false, item.id);
    $('amount').value = ''; $('comment').value = ''; $('dist').value = '';
    $('date').value = todayStr();
    state.category = ''; state.showAll = false; $('more').open = false;
    render();
    syncAll();
  };

  $('undoBtn').onclick = function () {
    var id = state.lastId; if (!id) return;
    state.lastId = null;
    $('toast').classList.remove('show');
    var q = lsGet('queue', []);
    if (q.some(function (x) { return x.id === id; })) {
      lsSet('queue', q.filter(function (x) { return x.id !== id; }));
      render(); toast('Запис скасовано');
      return;
    }
    var s = lsGet('synced', {})[id];
    if (!s) { toast('Не вдалося скасувати — видали рядок у таблиці', true); return; }
    api({ action: 'undo', row: s.row, stamp: s.stamp })
      .then(function () { toast('Запис скасовано'); load(); })
      .catch(function (e) { toast(e.message, true); });
  };

  $('amount').addEventListener('keydown', function (e) { if (e.key === 'Enter') this.blur(); });
  $('comment').addEventListener('keydown', function (e) { if (e.key === 'Enter') this.blur(); });
  window.addEventListener('online', syncAll);
  window.addEventListener('offline', render);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') { if (!$('more').open) $('date').value = todayStr(); syncAll(); }
  });

  render();
  syncAll();

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
</html>
